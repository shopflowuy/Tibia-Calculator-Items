<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Precios de Tibia</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #121212; color: #fff; }
    .container { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #333; border-radius: 8px; background: #1e1e1e; }
    .field { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #fff; }
  </style>
</head>
<body>

<div class="container">
  <h2>Calculadora Tibia</h2>
  
  <div class="field">
    <label for="tc">Tibia Coins (TC):</label>
    <input type="number" id="tc" placeholder="0" oninput="calcularDesdeTC(this.value)">
  </div>

  <div class="field">
    <label for="usd">Dólares (USD):</label>
    <input type="number" id="usd" placeholder="0" oninput="calcularDesdeUSD(this.value)">
  </div>

  <div class="field">
    <label for="gold">Gold Coins (GP):</label>
    <input type="number" id="gold" placeholder="0" oninput="calcularDesdeGold(this.value)">
  </div>
</div>

<script>
  // Tasas de conversión fijas según tus datos:
  // 250 TC = 12.5 USD -> 1 TC = 0.05 USD
  // 1 TC = 42,000 Gold
  const USD_POR_TC = 12.5 / 250; 
  const GOLD_POR_TC = 42000;

  function calcularDesdeTC(val) {
    const tc = parseFloat(val);
    if (isNaN(tc)) return limpiar();
    
    document.getElementById('usd').value = (tc * USD_POR_TC).toFixed(2);
    document.getElementById('gold').value = Math.round(tc * GOLD_POR_TC);
  }

  function calcularDesdeUSD(val) {
    const usd = parseFloat(val);
    if (isNaN(usd)) return limpiar();
    
    const tc = usd / USD_POR_TC;
    document.getElementById('tc').value = tc.toFixed(2);
    document.getElementById('gold').value = Math.round(tc * GOLD_POR_TC);
  }

  function calcularDesdeGold(val) {
    const gold = parseFloat(val);
    if (isNaN(gold)) return limpiar();
    
    const tc = gold / GOLD_POR_TC;
    document.getElementById('tc').value = tc.toFixed(2);
    document.getElementById('usd').value = (tc * USD_POR_TC).toFixed(2);
  }

  function limpiar() {
    document.getElementById('tc').value = '';
    document.getElementById('usd').value = '';
    document.getElementById('gold').value = '';
  }
</script>

</body>
</html>
